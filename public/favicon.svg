<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e5631" />
      <stop offset="100%" stop-color="#0a1c10" />
    </radialGradient>
    
    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf5e6" />
      <stop offset="30%" stop-color="#dfba6b" />
      <stop offset="70%" stop-color="#b58d3d" />
      <stop offset="100%" stop-color="#8a6421" />
    </linearGradient>

    <!-- Soft Gold Gradient for Text/Accents -->
    <linearGradient id="softGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b58d3d" />
      <stop offset="50%" stop-color="#dfba6b" />
      <stop offset="100%" stop-color="#fbf5e6" />
    </linearGradient>
  </defs>

  <!-- Background Circle with Gold Border -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />
  
  <!-- Inner thin gold circle for classical aesthetic -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Stylized Writing Quill (Feather) in the background, rotated elegantly -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Main Quill Shaft -->
    <path d="M 256 420 C 256 420 254 380 254 300 L 258 300 C 258 380 256 420 256 420 Z" fill="url(#goldGrad)" />
    <!-- Feather Vanes -->
    <path d="M 256 320 
             C 210 280, 200 200, 256 100 
             C 312 200, 302 280, 256 320 Z" fill="url(#goldGrad)" opacity="0.25" />
             
    <!-- Elegant Feather Barbs (Lines) -->
    <path d="M 256 120 C 240 140, 230 170, 232 200" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7" />
    <path d="M 256 160 C 235 180, 225 210, 227 240" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7" />
    <path d="M 256 200 C 230 220, 220 250, 222 280" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7" />
    <path d="M 256 240 C 225 260, 215 290, 218 310" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7" />
    
    <path d="M 256 120 C 272 140, 282 170, 280 200" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7" />
    <path d="M 256 160 C 277 180, 287 210, 285 240" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7" />
    <path d="M 256 200 C 282 220, 292 250, 290 280" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7" />
    <path d="M 256 240 C 287 260, 297 290, 294 310" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7" />

    <!-- Pen nib highlight -->
    <path d="M 256 420 L 253 435 L 259 435 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Elegant Arabic Letter (ش) in Calligraphic Style -->
  <!-- Shifted slightly lower and centered to look perfect inside the circle -->
  <text x="256" y="275" 
        font-family="'Amiri', 'Traditional Arabic', 'Scheherazade', 'Noto Naskh Arabic', 'serif'" 
        font-size="220" 
        font-weight="bold" 
        fill="url(#softGold)" 
        text-anchor="middle" 
        dominant-baseline="middle"
        style="text-shadow: 0px 4px 12px rgba(0,0,0,0.6);">ش</text>
        
  <!-- Sparkles for a magical poetic vibe -->
  <path d="M 140 160 L 143 166 L 149 169 L 143 172 L 140 178 L 137 172 L 131 169 L 137 166 Z" fill="url(#goldGrad)" />
  <path d="M 370 340 L 372 344 L 376 346 L 372 348 L 370 352 L 368 348 L 364 346 L 368 344 Z" fill="url(#goldGrad)" />
</svg>
